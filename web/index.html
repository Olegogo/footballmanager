<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FIFA Football Cards</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <div class="app-shell">
      <header class="topbar">
        <h1 id="chatTitle">Игровой день</h1>
        <button class="ghost-button" id="refreshButton" type="button" aria-label="Обновить">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.6 6.4A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4z"></path>
          </svg>
        </button>
      </header>

      <main id="content" class="content"></main>

      <nav class="tabbar" aria-label="Навигация">
        <button class="tab-button active" id="tab-game" data-tab="game" type="button" aria-label="Текущая игра">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5a9.5 9.5 0 1 1 0 19 9.5 9.5 0 0 1 0-19zm0 2a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15zm1 3.2v4l3 1.8a1 1 0 0 1-1 1.7l-3.5-2.1a1 1 0 0 1-.5-.9V7.7a1 1 0 1 1 2 0z"></path>
          </svg>
        </button>
        <button class="tab-button" id="tab-games" data-tab="games" type="button" aria-label="Игры">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 2.5a1 1 0 0 1 1 1v1h8v-1a1 1 0 1 1 2 0v1h.7A2.3 2.3 0 0 1 21 6.8v11.9A2.3 2.3 0 0 1 18.7 21H5.3A2.3 2.3 0 0 1 3 18.7V6.8A2.3 2.3 0 0 1 5.3 4.5H6v-1a1 1 0 0 1 1-1zm12 7H5v9.2c0 .2.1.3.3.3h13.4c.2 0 .3-.1.3-.3V9.5zm-1-3H5.3c-.2 0-.3.1-.3.3v.7h14v-.7c0-.2-.1-.3-.3-.3zM8 12h2.5v2.5H8V12zm5.5 0H16v2.5h-2.5V12zM8 16h2.5v2H8v-2zm5.5 0H16v2h-2.5v-2z"></path>
          </svg>
        </button>
        <button class="tab-button" id="tab-players" data-tab="players" type="button" aria-label="Список игроков">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.2a4.4 4.4 0 1 1 0 8.8 4.4 4.4 0 0 1 0-8.8zm0 10.8c4.5 0 8.2 2.3 8.2 5.2 0 .9-.7 1.6-1.6 1.6H5.4A1.6 1.6 0 0 1 3.8 19c0-2.9 3.7-5 8.2-5z"></path>
          </svg>
        </button>
      </nav>
    </div>

    <div id="modalRoot"></div>
    <div id="toast" class="toast hidden"></div>

    <script src="/config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
