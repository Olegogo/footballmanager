<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FIFA Football Cards</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Football Chat Miniapp</p>
          <h1 id="chatTitle">FIFA Cards</h1>
        </div>
        <button class="ghost-button" id="refreshButton" type="button" aria-label="Обновить">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.6 6.4A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4z"></path>
          </svg>
        </button>
      </header>

      <main id="content" class="content"></main>

      <nav class="tabbar" aria-label="Навигация">
        <button class="tab-button active" id="tab-game" data-tab="game" type="button" aria-label="Текущая игра">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11.98 2 5 4.72v5.53C5 15.61 8.84 20.55 12 22c3.16-1.45 7-6.39 7-11.75V4.72L11.98 2zm2.57 5.8 2.1 1.2-.24 2.41-2.38.48-1.63-1.68.73-2.41 1.42 0zm-5.13 0h1.43l.73 2.41-1.64 1.68-2.38-.48L7.32 9l2.1-1.2zm-1.1 6.18 2.13-.38 1.18 1.17V17l-2 1.3-2.06-1.54.75-2.48zm5.36 3.02v-2.23l1.18-1.17 2.13.38.75 2.48-2.06 1.54-2-1.3z"></path>
          </svg>
        </button>
        <button class="tab-button" id="tab-players" data-tab="players" type="button" aria-label="Список игроков">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 2h10a2 2 0 0 1 2 2v16l-7-3-7 3V4a2 2 0 0 1 2-2zm1.5 4v2h7V6h-7zm0 4v2h5v-2h-5z"></path>
          </svg>
        </button>
      </nav>
    </div>

    <div id="modalRoot"></div>
    <div id="toast" class="toast hidden"></div>

    <script src="/config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
