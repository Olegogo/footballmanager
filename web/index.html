<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FIFA Football Cards</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <div class="app-shell">
      <header class="topbar">
        <h1 id="chatTitle">Игровой день</h1>
        <button class="ghost-button" id="refreshButton" type="button" aria-label="Обновить">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.6 6.4A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4z"></path>
          </svg>
        </button>
      </header>

      <main id="content" class="content"></main>

      <nav class="tabbar" aria-label="Навигация">
        <button class="tab-button active" id="tab-game" data-tab="game" type="button" aria-label="Текущая игра">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.3 4.6 5.2l-1.3 7.6L8 20.7h8l4.7-7.9-1.3-7.6L12 2.3zm0 2.2 4.8 1.8.8 4.5-2.2 1.8-3-.8-.9-3.1 1.5-2.3H12zm-1.3 4.2-.9 3.1-3 .8-2.2-1.8.8-4.5L10.2 4h.2l1.5 2.7zm-2.4 5.1 2.5-.7 1.2 1v2.8L9.6 19l-2.4-2.3 1.1-2.9zm5.7 3.2v-2.8l1.2-1 2.5.7 1.1 2.9-2.4 2.3-2.4-2.1z"></path>
          </svg>
        </button>
        <button class="tab-button" id="tab-players" data-tab="players" type="button" aria-label="Список игроков">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.2a4.4 4.4 0 1 1 0 8.8 4.4 4.4 0 0 1 0-8.8zm0 10.8c4.5 0 8.2 2.3 8.2 5.2 0 .9-.7 1.6-1.6 1.6H5.4A1.6 1.6 0 0 1 3.8 19c0-2.9 3.7-5 8.2-5z"></path>
          </svg>
        </button>
      </nav>
    </div>

    <div id="modalRoot"></div>
    <div id="toast" class="toast hidden"></div>

    <script src="/config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
