<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FIFA Football Cards</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <div class="app-shell">
      <header class="topbar">
        <h1 id="chatTitle">⚽</h1>
        <div class="game-top-actions" id="gameTopActions" hidden>
          <button class="game-top-button" id="gameMenuButton" type="button" aria-label="Actions">•••</button>
          <button class="game-top-button game-share-button" id="gameShareButton" type="button" aria-label="Share game">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.9 19.4c2.2-6.7 6.9-10.5 13.1-11.1V4.7c0-.9 1.1-1.4 1.8-.8l4.6 4.6c.5.5.5 1.2 0 1.7l-4.6 4.6c-.7.7-1.8.2-1.8-.8v-3.1c-4.8.2-8.6 2.5-12 8-.4.6-1.3.3-1.1-.5Z"></path>
            </svg>
          </button>
          <button class="game-top-button" id="closeGameButton" type="button" aria-label="Close">×</button>
        </div>
      </header>

      <main id="content" class="content"></main>

      <nav class="tabbar" aria-label="Navigation">
        <button class="tab-button active" id="tab-games" data-tab="games" type="button" aria-label="Games">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 2.5a1 1 0 0 1 1 1v1h8v-1a1 1 0 1 1 2 0v1h.7A2.3 2.3 0 0 1 21 6.8v11.9A2.3 2.3 0 0 1 18.7 21H5.3A2.3 2.3 0 0 1 3 18.7V6.8A2.3 2.3 0 0 1 5.3 4.5H6v-1a1 1 0 0 1 1-1zm12 7H5v9.2c0 .2.1.3.3.3h13.4c.2 0 .3-.1.3-.3V9.5zm-1-3H5.3c-.2 0-.3.1-.3.3v.7h14v-.7c0-.2-.1-.3-.3-.3zM8 12h2.5v2.5H8V12zm5.5 0H16v2.5h-2.5V12zM8 16h2.5v2H8v-2zm5.5 0H16v2h-2.5v-2z"></path>
          </svg>
        </button>
        <button class="tab-button" id="tab-players" data-tab="players" type="button" aria-label="Players">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8.8 4.3a3.8 3.8 0 1 1 0 7.6 3.8 3.8 0 0 1 0-7.6zm8.1 1.2a3.2 3.2 0 1 1 0 6.4 3.2 3.2 0 0 1 0-6.4zM8.8 13.5c3.8 0 6.9 1.9 6.9 4.4 0 .8-.6 1.4-1.4 1.4h-11c-.8 0-1.4-.6-1.4-1.4 0-2.5 3.1-4.4 6.9-4.4zm8.1.4c2.9 0 5.2 1.5 5.2 3.5 0 .7-.5 1.2-1.2 1.2h-3.6c.1-.2.1-.5.1-.7 0-1.5-.8-2.8-2.2-3.8.5-.1 1.1-.2 1.7-.2z"></path>
          </svg>
        </button>
        <button class="tab-button" id="tab-profile" data-tab="profile" type="button" aria-label="Profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.2a4.4 4.4 0 1 1 0 8.8 4.4 4.4 0 0 1 0-8.8zm0 10.8c4.5 0 8.2 2.3 8.2 5.2 0 .9-.7 1.6-1.6 1.6H5.4A1.6 1.6 0 0 1 3.8 19c0-2.9 3.7-5 8.2-5z"></path>
          </svg>
        </button>
      </nav>
    </div>

    <div id="modalRoot"></div>
    <div id="toast" class="toast hidden"></div>

    <script src="/config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
