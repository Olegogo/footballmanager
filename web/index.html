<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FIFA Football Cards</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <div class="app-shell">
      <header class="topbar">
        <h1 id="chatTitle">Игровой день</h1>
        <button class="ghost-button" id="refreshButton" type="button" aria-label="Обновить">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.6 6.4A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4z"></path>
          </svg>
        </button>
      </header>

      <main id="content" class="content"></main>

      <nav class="tabbar" aria-label="Навигация">
        <button class="tab-button active" id="tab-game" data-tab="game" type="button" aria-label="Текущая игра">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2.1 2.8 2 .9 3.1-1.8 2.4h-3.8L8.3 9.2l.9-3.1 2.8-2zm-5.8 3.1 1.7.6-.7 2.6-1.9 1.5-.9-2.6 1.8-2.1zm11.6 0 1.8 2.1-.9 2.6-1.9-1.5-.7-2.6 1.7-.6zM8.7 13.3h6.6l1.3 4-2.7 1.9h-3.8l-2.7-1.9 1.3-4zm-2.1.3 1.8 1.4-.9 2.7-2.2.2a8 8 0 0 1-1.2-3.4l2.5-.9zm8.8 4.1-.9-2.7 1.8-1.4 2.5.9a8 8 0 0 1-1.2 3.4l-2.2-.2z"></path>
          </svg>
        </button>
        <button class="tab-button" id="tab-players" data-tab="players" type="button" aria-label="Список игроков">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.2a4.4 4.4 0 1 1 0 8.8 4.4 4.4 0 0 1 0-8.8zm0 10.8c4.5 0 8.2 2.3 8.2 5.2 0 .9-.7 1.6-1.6 1.6H5.4A1.6 1.6 0 0 1 3.8 19c0-2.9 3.7-5 8.2-5z"></path>
          </svg>
        </button>
      </nav>
    </div>

    <div id="modalRoot"></div>
    <div id="toast" class="toast hidden"></div>

    <script src="/config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
